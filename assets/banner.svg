<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Heading Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="statusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pillShimmer {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 7px #818cf8); }
    }
    @keyframes badgeBlink {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.4; r: 3.5; }
    }
    .flow-dash {
      stroke-dasharray: 6 6;
      animation: flowLine 3s linear infinite;
    }
    .flow-dash-rev {
      stroke-dasharray: 6 6;
      animation: flowLine 3s linear infinite reverse;
    }
    .floating-box {
      animation: floatCard 5.5s ease-in-out infinite;
    }
    .pulsing-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .shimmer-pill {
      animation: pillShimmer 3.5s ease-in-out infinite;
    }
    .blink-dot {
      animation: badgeBlink 2s ease-in-out infinite;
    }
    .title-font {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-font {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.1px;
    }
    .mono-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Architecture Grid Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="90" r="170" fill="url(#glowGrad)" class="pulsing-glow" />
  <circle cx="980" cy="270" r="210" fill="url(#glowGrad)" class="pulsing-glow" style="animation-delay: -3s;" />

  <!-- ================= LEFT: HERO HEADINGS & BADGES (FOREGROUND) ================= -->
  <g transform="translate(70, 50)">
    <!-- Curated Category Tag -->
    <g class="shimmer-pill">
      <rect x="0" y="0" width="265" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="16" cy="14" r="4.5" fill="#38bdf8" class="blink-dot" />
      <text x="30" y="18" fill="#38bdf8" class="mono-font">CURATED DIRECTORY · 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="url(#primaryGrad)" class="title-font" font-size="36">Awesome Sales Proposal &amp;</text>
    <text x="0" y="118" fill="#ffffff" class="title-font" font-size="36">Document Automation</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="156" fill="#94a3b8" class="subtitle-font" font-size="14.5">
      A comprehensive guide to CPQ engines, RFP auto-responders,
    </text>
    <text x="0" y="178" fill="#94a3b8" class="subtitle-font" font-size="14.5">
      digital sales rooms, and open-source document generation stacks.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 206)">
      <!-- Pill 1: CPQ Engines -->
      <g>
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="10" y="17" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="600">⚡ CPQ Workflows</text>
      </g>
      <!-- Pill 2: RFP Response -->
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="10" y="17" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="600">📑 RFP Automation</text>
      </g>
      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(237, 0)">
        <rect x="0" y="0" width="118" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="10" y="17" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="600">🔓 Self-Hosted Engines</text>
      </g>
      <!-- Pill 4: e-Sign -->
      <g transform="translate(365, 0)">
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="10" y="17" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="600">✍️ e-Sign &amp; DSR</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: INTERACTIVE DYNAMIC PIPELINE CAROUSEL ================= -->
  <g class="floating-box" transform="translate(675, 42)">
    <!-- Container Card -->
    <rect x="0" y="0" width="465" height="270" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Terminal/Header Bar -->
    <rect x="0" y="0" width="465" height="38" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="19" r="5" fill="#10b981" opacity="0.8" />
    <text x="75" y="23" fill="#cbd5e1" class="mono-font" font-size="11">DOCUMENT GENERATION PIPELINE</text>
    <rect x="360" y="9" width="90" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="375" y="23" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5">● RUNNING</text>

    <!-- Pipeline Step 1: RFP Ingest / Deal Sync -->
    <g transform="translate(24, 56)">
      <rect x="0" y="0" width="120" height="78" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="10" y="24" font-size="16">📥</text>
      <text x="34" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Deal / RFP</text>
      <text x="10" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">HubSpot / SFDC</text>
      <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">RFQ / Questionnaire</text>
      <text x="10" y="70" fill="#38bdf8" class="mono-font" font-size="8.5">CRM Triggered</text>
    </g>

    <!-- Connector Line 1 -> 2 -->
    <path d="M 144 95 L 172 95" fill="none" stroke="#38bdf8" stroke-width="2.2" class="flow-dash" />

    <!-- Pipeline Step 2: CPQ & Generation Engine -->
    <g transform="translate(172, 56)">
      <rect x="0" y="0" width="120" height="78" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="10" y="24" font-size="16">⚙️</text>
      <text x="34" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="11">CPQ Engine</text>
      <text x="10" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Dynamic Pricing</text>
      <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Typst / Carbone</text>
      <text x="10" y="70" fill="#a5b4fc" class="mono-font" font-size="8.5">Doc Assemble</text>
    </g>

    <!-- Connector Line 2 -> 3 -->
    <path d="M 292 95 L 320 95" fill="none" stroke="#c084fc" stroke-width="2.2" class="flow-dash" />

    <!-- Pipeline Step 3: Interactive Proposal / DSR -->
    <g transform="translate(320, 56)">
      <rect x="0" y="0" width="120" height="78" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="10" y="24" font-size="16">📑</text>
      <text x="34" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Proposal DSR</text>
      <text x="10" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Interactive Web</text>
      <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Video &amp; Analytics</text>
      <text x="10" y="70" fill="#e879f9" class="mono-font" font-size="8.5">Page Heatmaps</text>
    </g>

    <!-- Connector Flow Down to E-Sign Stage -->
    <path d="M 232 134 L 232 154" fill="none" stroke="#818cf8" stroke-width="2.2" class="flow-dash" />

    <!-- Bottom Stage: e-Signature, Close & Enterprise ERP Sync -->
    <g transform="translate(24, 154)">
      <rect x="0" y="0" width="416" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <!-- Left sub-box: E-Sign Status -->
      <g transform="translate(16, 14)">
        <text x="0" y="16" font-size="18">✍️</text>
        <text x="26" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Legally-Binding e-Sign &amp; Audit Trail</text>
        <text x="26" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">DocuSign · PandaDoc · Documenso · Signoz · Oneflow</text>
        <text x="26" y="52" fill="#64748b" class="mono-font" font-size="9.5">eIDAS / ESIGN Act Compliant · SHA-256 Tamper-Proof Audit</text>
      </g>
      <!-- Live Status Badge on Right -->
      <g transform="translate(315, 20)">
        <rect x="0" y="0" width="85" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="10" y="19" fill="#10b981" class="mono-font" font-size="10">DEAL CLOSED</text>
        <text x="10" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="11">100% Won 🚀</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primaryGrad)" />
</svg>
